<main class="mx-auto min-w-0 max-w-shell px-4 py-8 pb-10 sm:px-6 lg:px-12 lg:py-10 lg:pb-16">
  <app-page-header
    [kicker]="kickerKey() | transloco"
    [title]="'shell.plus.title' | transloco"
    [intro]="'shell.plus.subtitle' | transloco"
  />

  <section aria-labelledby="plus-destinations-title">
    <h2
      id="plus-destinations-title"
      class="font-sans text-[22px] font-medium leading-tight text-text sm:text-2xl"
    >
      {{ 'shell.plus.section' | transloco }}
    </h2>

    <div class="mt-4 divide-y divide-line border-y border-line">
      @for (destination of destinations(); track destination.path) {
        <a
          [routerLink]="destination.path"
          [queryParams]="{ from: 'plus' }"
          class="group flex min-h-[76px] items-center gap-3 py-4 outline-none transition-colors hover:text-gold-hover focus-visible:text-gold-hover focus-visible:ring-[3px] focus-visible:ring-gold-wash"
        >
          <span
            class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-gold-wash text-gold-hover"
            aria-hidden="true"
          >
            @switch (destination.icon) {
              @case ('roles') {
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="9" cy="7" r="4" />
                  <path d="M3 21a6 6 0 0 1 12 0M16 11a4 4 0 0 1 4 4v6M15 3.2a4 4 0 0 1 0 7.6" />
                </svg>
              }
              @case ('categories') {
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M20.6 13.4 11 3.8V2H4v7h1.8l9.6 9.6a2 2 0 0 0 2.8 0l2.4-2.4a2 2 0 0 0 0-2.8Z"
                  />
                  <circle cx="7.5" cy="5.5" r=".5" />
                </svg>
              }
              @default {
                <svg
                  class="h-5 w-5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="8" r="4" />
                  <path d="M4 21a8 8 0 0 1 16 0" />
                </svg>
              }
            }
          </span>
          <span class="min-w-0 flex-1">
            <strong class="block text-[15px] font-medium text-text group-hover:text-gold-hover">
              {{ destination.titleKey | transloco }}
            </strong>
            <span class="mt-1 block text-sm text-text-2">
              {{ destination.descriptionKey | transloco }}
            </span>
          </span>
          <svg
            class="h-5 w-5 shrink-0 text-text-3 transition-transform group-hover:translate-x-0.5 group-hover:text-gold-hover"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </a>
      }
    </div>
  </section>
</main>
