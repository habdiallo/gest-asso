<app-form-dialog
  [open]="open()"
  [dialogTitle]="'incomeCategories.createDialog.title' | transloco"
  [closeLabel]="'incomeCategories.createDialog.cancel' | transloco"
  (closed)="closed.emit()"
>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label
        for="income-category-label"
        class="mb-2 block text-[9px] font-medium uppercase tracking-[0.1em] text-text-3"
      >
        {{ 'incomeCategories.createDialog.labelLabel' | transloco }}
      </label>
      <input
        id="income-category-label"
        type="text"
        formControlName="label"
        required
        maxlength="100"
        [attr.aria-invalid]="labelInvalid() ? true : null"
        [attr.aria-describedby]="labelInvalid() ? 'income-category-label-error' : null"
        class="h-12 w-full rounded-lg border border-line bg-surface-2 px-3 text-text outline-none focus:border-gold focus:ring-[3px] focus:ring-gold-wash"
      />
      @if (labelInvalid()) {
        <p id="income-category-label-error" class="mt-2 text-sm text-error" role="alert">
          {{ 'incomeCategories.createDialog.labelRequired' | transloco }}
        </p>
      }
    </div>

    @if (errorMessage(); as errorKey) {
      <p class="mt-4 text-sm text-error" role="alert">{{ errorKey | transloco }}</p>
    }

    <div class="mt-6 flex items-center justify-end gap-3">
      <button
        type="button"
        [disabled]="submitting()"
        (click)="closed.emit()"
        class="inline-flex h-11 items-center rounded-lg border border-line px-4 text-[10px] font-medium uppercase tracking-[0.1em] text-text transition-colors hover:border-line-strong disabled:opacity-40"
      >
        {{ 'incomeCategories.createDialog.cancel' | transloco }}
      </button>
      <button
        type="submit"
        [disabled]="submitting()"
        class="inline-flex h-11 items-center rounded-lg bg-gold px-4 text-[10px] font-medium uppercase tracking-[0.1em] text-gold-ink transition-colors hover:bg-gold-hover disabled:opacity-40"
      >
        {{
          (submitting()
            ? 'incomeCategories.createDialog.submitting'
            : 'incomeCategories.createDialog.submit'
          ) | transloco
        }}
      </button>
    </div>
  </form>
</app-form-dialog>
