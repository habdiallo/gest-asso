<app-form-dialog
  [open]="open()"
  [kicker]="'incomeCategories.dialog.kicker' | transloco"
  [dialogTitle]="'incomeCategories.dialog.title' | transloco"
  [desktopWidth]="'680px'"
  [closeLabel]="'incomeCategories.dialog.close' | transloco"
  (closed)="closed.emit()"
>
  <app-income-category-form
    [form]="form"
    labelControlId="income-category-label"
    labelErrorId="income-category-label-error"
    [labelInvalid]="labelInvalid()"
    [labelRequired]="'incomeCategories.createDialog.labelRequired'"
    [errorMessage]="errorMessage()"
    [submitting]="submitting()"
    [submitLabel]="'incomeCategories.dialog.submit'"
    [submittingLabel]="'incomeCategories.dialog.submitting'"
    (submitted)="submit()"
    (cancelled)="closed.emit()"
  />
</app-form-dialog>
