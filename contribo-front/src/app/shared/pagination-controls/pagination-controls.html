<nav
  class="responsive-body mt-6 flex items-center justify-between gap-3"
  [attr.aria-label]="navigationLabel()"
>
  <button
    type="button"
    class="responsive-body inline-flex min-h-11 min-w-11 items-center justify-center rounded border border-line px-3 py-2 text-text outline-none transition-[border-color,background-color,color,opacity] duration-[180ms] hover:border-line-strong focus-visible:border-gold focus-visible:ring-[3px] focus-visible:ring-gold-wash disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-[0.42] tablet:min-w-0"
    [disabled]="previousDisabled()"
    [attr.aria-disabled]="previousDisabled() ? 'true' : null"
    (click)="previousPage.emit()"
  >
    <span class="text-xl leading-none tablet:hidden" aria-hidden="true">‹</span>
    <span class="sr-only tablet:not-sr-only">{{ previousLabel() }}</span>
  </button>
  <p class="min-w-12 text-center text-text-2" role="status">
    <span class="tablet:hidden" aria-hidden="true"
      >{{ currentPage() }}/{{ totalPages() }}</span
    >
    <span class="sr-only tablet:not-sr-only">{{ statusLabel() }}</span>
  </p>
  <button
    type="button"
    class="responsive-body inline-flex min-h-11 min-w-11 items-center justify-center rounded border border-line px-3 py-2 text-text outline-none transition-[border-color,background-color,color,opacity] duration-[180ms] hover:border-line-strong focus-visible:border-gold focus-visible:ring-[3px] focus-visible:ring-gold-wash disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-[0.42] tablet:min-w-0"
    [disabled]="nextDisabled()"
    [attr.aria-disabled]="nextDisabled() ? 'true' : null"
    (click)="nextPage.emit()"
  >
    <span class="text-xl leading-none tablet:hidden" aria-hidden="true">›</span>
    <span class="sr-only tablet:not-sr-only">{{ nextLabel() }}</span>
  </button>
</nav>
