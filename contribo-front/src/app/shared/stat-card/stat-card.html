<article class="relative overflow-hidden rounded-card border border-line bg-surface-glass p-5">
  <div class="absolute inset-x-0 top-0 h-0.5 bg-gold" aria-hidden="true"></div>
  <div class="flex items-start justify-between gap-3">
    <p class="text-xs uppercase tracking-[0.1em] text-text-2">{{ label() }}</p>
    <span class="text-gold" aria-hidden="true">
      @switch (icon()) {
        @case ('users') {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
        }
        @case ('user-plus') {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <circle cx="9" cy="7" r="4" />
            <path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M19 8v6M16 11h6" />
          </svg>
        }
        @case ('campaigns') {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M4 19h16M6 16V8l6-4 6 4v8M9 16v-4h6v4" />
          </svg>
        }
        @case ('members') {
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <path d="M4 19h16M6 17V7h12v10M9 10h6M9 13h6" />
          </svg>
        }
      }
    </span>
  </div>
  <p class="mt-3 font-display text-3xl text-text">{{ value() }}</p>
  @if (detail(); as detail) {
    <p class="mt-1 text-xs text-text-2">{{ detail }}</p>
  }
</article>
