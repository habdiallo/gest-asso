@let currentTheme = theme();

<button
  type="button"
  class="inline-flex h-10 w-10 items-center justify-center rounded-full border border-line text-text transition-colors hover:border-line-strong hover:text-gold-hover"
  [attr.aria-label]="currentTheme === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'"
  (click)="toggleTheme()"
>
  @if (currentTheme === 'dark') {
    <svg
      class="h-5 w-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
      />
    </svg>
  } @else {
    <svg
      class="h-5 w-5"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
  }
</button>
