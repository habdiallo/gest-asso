<div class="relative w-full" (focusout)="handleFocusOut($event)">
  <button
    #trigger
    type="button"
    [id]="controlId()"
    [disabled]="disabled() || disabledInput()"
    aria-haspopup="dialog"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || placeholder()"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="ariaInvalid() || (required() && !value()) ? true : null"
    [attr.aria-describedby]="ariaDescribedBy()"
    class="app-form-control flex min-h-control w-full items-center justify-between gap-3 rounded-control border border-line bg-surface-2 px-3 text-left text-text disabled:pointer-events-none disabled:opacity-40"
    (click)="toggleOpen()"
    (keydown)="handleTriggerKeydown($event)"
  >
    <span class="truncate" [class.text-text-2]="!displayValue()">
      {{ displayValue() || placeholder() }}
    </span>
    <svg
      class="h-5 w-5 shrink-0 text-text-2"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
      <path d="M7 3.5v3M17 3.5v3M3.5 9h17" />
    </svg>
  </button>

  @if (open()) {
    <div
      role="dialog"
      [attr.aria-label]="'shared.dateInput.calendar' | transloco: { month: monthLabel() }"
      class="absolute left-0 top-full z-[70] mt-2 w-[min(100%,22rem)] rounded border border-line-strong bg-surface-glass p-3 shadow-[0_18px_48px_-10px_rgba(0,0,0,0.48)] backdrop-blur-xl"
    >
      <div class="mb-3 flex items-center justify-between gap-2">
        <p class="font-semibold text-text">{{ monthLabel() }}</p>
        <div class="flex items-center gap-1">
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded text-text-2 hover:bg-surface-2 hover:text-text"
            [attr.aria-label]="'shared.dateInput.previousMonth' | transloco"
            (click)="moveMonth(-1)"
          >
            <span aria-hidden="true" class="text-xl leading-none">‹</span>
          </button>
          <button
            type="button"
            class="flex h-9 w-9 items-center justify-center rounded text-text-2 hover:bg-surface-2 hover:text-text"
            [attr.aria-label]="'shared.dateInput.nextMonth' | transloco"
            (click)="moveMonth(1)"
          >
            <span aria-hidden="true" class="text-xl leading-none">›</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-medium uppercase text-text-2">
        @for (weekday of weekdays; track $index) {
          <span class="py-1">{{ weekday }}</span>
        }
      </div>
      <div class="grid grid-cols-7 gap-1 text-center">
        @for (day of calendarDays(); track day.iso) {
          <button
            type="button"
            class="flex h-9 items-center justify-center rounded text-sm text-text transition-colors hover:bg-gold-wash focus-visible:outline focus-visible:outline-2 focus-visible:outline-text"
            [class.text-text-2]="!day.currentMonth && !day.selected"
            [class.bg-gold-wash]="day.selected"
            [class.ring-1]="day.selected"
            [class.ring-gold]="day.selected"
            [class.font-semibold]="day.selected || day.today"
            [attr.aria-current]="day.today ? 'date' : null"
            [attr.aria-pressed]="day.selected"
            (click)="selectDate(day)"
          >
            {{ day.label }}
          </button>
        }
      </div>

      <div class="mt-3 flex items-center justify-between border-t border-line pt-3 text-sm">
        <button
          type="button"
          class="text-info hover:text-text"
          [disabled]="!value()"
          (click)="clear()"
        >
          {{ 'shared.dateInput.clear' | transloco }}
        </button>
        <button
          type="button"
          class="font-medium text-text underline decoration-gold decoration-2 underline-offset-4 hover:text-text disabled:cursor-not-allowed disabled:opacity-45"
          [disabled]="todayActionDisabled()"
          (click)="selectToday()"
        >
          {{ 'shared.dateInput.today' | transloco }}
        </button>
      </div>
    </div>
  }
</div>
