<div class="flex flex-col gap-2">
  <app-custom-select
    [controlId]="fieldId"
    [label]="label()"
    [options]="options"
    [value]="value()"
    [required]="required()"
    [showRequiredError]="false"
    [ariaInvalid]="touched() && required() && !value()"
    [ariaDescribedBy]="touched() && required() && !value() ? errorId : null"
    (valueChange)="handleChange($event)"
    (touchedChange)="handleBlur()"
  />
  @if (touched() && required() && !value()) {
    <p [id]="errorId" class="text-sm text-error" role="alert">
      Le mode de règlement est obligatoire.
    </p>
  }
</div>
