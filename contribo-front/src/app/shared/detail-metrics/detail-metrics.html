<dl class="grid grid-cols-2 gap-3 tablet:grid-cols-4 tablet:gap-6">
  @for (item of items(); track item.label) {
    <div class="min-w-0 rounded-card border border-line bg-surface p-4 tablet:rounded-none tablet:border-0 tablet:bg-transparent tablet:p-0">
      <dt class="text-sm font-normal leading-tight text-text-2 tablet:font-data tablet:text-[8px] tablet:font-medium tablet:uppercase tablet:tracking-[0.11em] tablet:text-text-3">
        {{ item.label }}
      </dt>
      <dd class="mt-4 font-display text-[25px] leading-none tracking-[0.04em] text-text tablet:mt-2">
        {{ item.value }}
      </dd>
      <dd class="mt-3 text-sm leading-tight text-text-3 tablet:mt-2 tablet:text-[10px]">{{ item.hint }}</dd>
    </div>
  }
</dl>
