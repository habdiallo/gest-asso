<dl class="grid grid-cols-2 gap-x-4 gap-y-6 tablet:grid-cols-4 tablet:gap-6">
  @for (item of items(); track item.label) {
    <div class="min-w-0">
      <dt
        class="responsive-label break-words font-data font-medium uppercase tracking-[0.11em] text-text-3"
      >
        {{ item.label }}
      </dt>
      <dd class="responsive-metric-value mt-2 break-words font-display tracking-[0.04em] text-text">
        {{ item.value }}
      </dd>
      <dd class="responsive-label mt-2 break-words text-text-3">{{ item.hint }}</dd>
    </div>
  }
</dl>
