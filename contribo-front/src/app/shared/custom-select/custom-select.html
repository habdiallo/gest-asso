<div class="relative flex flex-col gap-2" (focusout)="handleFocusOut($event)">
  @if (label()) {
    <label [attr.for]="fieldId()" class="responsive-body font-medium text-text-2"
      >{{ label() }}
      @if (required()) {
        <span aria-hidden="true" class="ml-1 text-gold">{{
          'shared.form.requiredIndicator' | transloco
        }}</span>
        <span class="sr-only"> ({{ 'shared.form.required' | transloco }})</span>
      }
    </label>
  }
  <button
    #trigger
    type="button"
    [id]="fieldId()"
    [disabled]="isDisabled()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || label() || null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="ariaInvalid() || (touched() && required() && !value()) ? true : null"
    [attr.aria-describedby]="
      ariaDescribedBy() || (touched() && required() && !value() ? errorId() : null)
    "
    class="app-form-control responsive-body flex w-full items-center justify-between gap-3 border border-line px-3 text-left text-text disabled:pointer-events-none disabled:opacity-40"
    [class.min-h-11]="compact()"
    [class.min-h-12]="!compact()"
    [class.rounded-full]="pill()"
    [class.rounded-lg]="compact() && !pill()"
    [class.rounded]="!compact() && !pill()"
    [class.bg-surface]="compact()"
    [class.bg-surface-2]="!compact()"
    (click)="toggleOpen()"
    (keydown)="handleTriggerKeydown($event)"
  >
    <span class="min-w-0 flex-1 truncate" [class.text-text-2]="!selectedOption()">
      @if (selectedOption(); as option) {
        @if (option.translationKey; as translationKey) {
          {{ translationKey | transloco }}
        } @else {
          {{ option.label }}
        }
      } @else {
        {{ placeholder() }}
      }
    </span>
    @if (showFilterIcon()) {
      <svg
        class="h-[15px] w-[15px] shrink-0 text-text-2"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M7 12h10M10 18h4" />
      </svg>
    } @else {
      <svg
        class="h-[15px] w-[15px] shrink-0 text-text-3 transition-transform"
        [class.rotate-180]="open()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 9l6 6 6-6" />
      </svg>
    }
  </button>
  @if (open()) {
    <div
      class="absolute left-0 right-0 top-full z-[60] mt-[7px] rounded-menu border border-line-strong bg-surface-glass p-1.5 shadow-[0_18px_48px_-10px_rgba(0,0,0,0.48)] backdrop-blur-xl"
    >
      @if (searchable()) {
        <div class="border-b border-line px-1 pb-1.5">
          <label [attr.for]="fieldId() + '-filter'" class="sr-only">
            {{ filterPlaceholder() }}
          </label>
          <input
            #filterInput
            [id]="fieldId() + '-filter'"
            type="search"
            [value]="filterQuery()"
            [placeholder]="filterPlaceholder()"
            [attr.aria-label]="filterPlaceholder()"
            [attr.aria-controls]="fieldId() + '-options'"
            class="app-form-control min-h-10 w-full rounded border border-line bg-surface-2 px-2.5 text-text"
            (input)="handleFilterInput($event)"
            (keydown)="handleFilterKeydown($event)"
          />
        </div>
      }
      <div
        [id]="fieldId() + '-options'"
        role="listbox"
        [attr.aria-labelledby]="fieldId()"
        class="max-h-[236px] overflow-y-auto pt-1.5"
      >
        @for (option of filteredOptions(); track option.value; let index = $index) {
          <button
            #optionButton
            type="button"
            role="option"
            [attr.tabindex]="index === activeOptionIndex() ? 0 : -1"
            [attr.data-value]="option.value"
            [attr.aria-selected]="option.value === value()"
            class="flex min-h-[42px] w-full items-center justify-between gap-2.5 rounded-option px-2.5 text-left text-text-2 outline-none hover:bg-surface-2 hover:text-text focus-visible:bg-surface-2 focus-visible:text-text"
            [class.text-gold]="option.value === value()"
            [class.bg-gold-wash]="option.value === value()"
            (click)="selectOption(option)"
            (keydown)="handleOptionKeydown($event, option)"
          >
            <span class="min-w-0 truncate">
              @if (option.translationKey; as translationKey) {
                {{ translationKey | transloco }}
              } @else {
                {{ option.label }}
              }
            </span>
            @if (option.value === value()) {
              <svg
                class="h-[15px] w-[15px] shrink-0"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 13l4 4L19 7" />
              </svg>
            }
          </button>
        } @empty {
          <p class="responsive-body px-2.5 py-3 text-text-2" role="status">
            {{ noOptionsMessage() }}
          </p>
        }
      </div>
    </div>
  }
  @if (showRequiredError() && touched() && required() && !value()) {
    <p [id]="errorId()" class="responsive-body text-error" role="alert">
      {{ requiredErrorMessage() }}
    </p>
  }
</div>
