<div class="relative flex flex-col gap-2" (focusout)="handleFocusOut($event)">
  @if (label()) {
    <label [attr.for]="fieldId()" class="text-sm font-medium text-text-2">{{ label() }}</label>
  }
  <button
    #trigger
    type="button"
    [id]="fieldId()"
    [disabled]="isDisabled()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || label() || null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-invalid]="ariaInvalid() || (touched() && required() && !value()) ? true : null"
    [attr.aria-describedby]="
      ariaDescribedBy() || (touched() && required() && !value() ? errorId() : null)
    "
    class="flex w-full items-center justify-between gap-3 border border-line px-3 text-left text-text outline-none transition-colors hover:border-line-strong focus-visible:border-gold focus-visible:ring-[3px] focus-visible:ring-gold-wash disabled:pointer-events-none disabled:opacity-40"
    [class.min-h-11]="compact()"
    [class.min-h-12]="!compact()"
    [class.rounded-lg]="compact()"
    [class.rounded]="!compact()"
    [class.bg-surface]="compact()"
    [class.bg-surface-2]="!compact()"
    (click)="toggleOpen()"
    (keydown)="handleTriggerKeydown($event)"
  >
    <span class="min-w-0 flex-1 truncate" [class.text-text-2]="!selectedOption()">
      @if (selectedOption(); as option) {
        @if (option.translationKey; as translationKey) {
          {{ translationKey | transloco }}
        } @else {
          {{ option.label }}
        }
      } @else {
        {{ placeholder() }}
      }
    </span>
    @if (showFilterIcon()) {
      <svg
        class="h-[15px] w-[15px] shrink-0 text-text-2"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M4 6h16M7 12h10M10 18h4" />
      </svg>
    } @else {
      <svg
        class="h-[15px] w-[15px] shrink-0 text-text-3 transition-transform"
        [class.rotate-180]="open()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M6 9l6 6 6-6" />
      </svg>
    }
  </button>
  @if (open()) {
    <div
      role="listbox"
      [attr.aria-labelledby]="fieldId()"
      class="absolute left-0 right-0 top-full z-[60] mt-[7px] max-h-[236px] overflow-y-auto rounded-[10px] border border-line-strong bg-surface-glass p-1.5 shadow-[0_18px_48px_-10px_rgba(0,0,0,0.48)] backdrop-blur-xl"
    >
      @for (option of options(); track option.value; let index = $index) {
        <button
          #optionButton
          type="button"
          role="option"
          [attr.tabindex]="index === activeOptionIndex() ? 0 : -1"
          [attr.data-value]="option.value"
          [attr.aria-selected]="option.value === value()"
          class="flex min-h-[42px] w-full items-center justify-between gap-2.5 rounded-[7px] px-2.5 text-left text-text-2 outline-none hover:bg-surface-2 hover:text-text focus-visible:bg-surface-2 focus-visible:text-text"
          [class.text-gold]="option.value === value()"
          [class.bg-gold-wash]="option.value === value()"
          (click)="selectOption(option)"
          (keydown)="handleOptionKeydown($event, option)"
        >
          <span class="min-w-0 truncate">
            @if (option.translationKey; as translationKey) {
              {{ translationKey | transloco }}
            } @else {
              {{ option.label }}
            }
          </span>
          @if (option.value === value()) {
            <svg
              class="h-[15px] w-[15px] shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 13l4 4L19 7" />
            </svg>
          }
        </button>
      }
    </div>
  }
  @if (showRequiredError() && touched() && required() && !value()) {
    <p [id]="errorId()" class="text-sm text-error" role="alert">{{ requiredErrorMessage() }}</p>
  }
</div>
