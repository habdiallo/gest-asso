<div #root class="relative w-full">
  <button
    [id]="triggerId()"
    data-select-trigger
    type="button"
    class="flex min-h-[48px] w-full items-center justify-between gap-3 rounded-lg border border-line bg-surface-2 px-3.5 text-left text-sm text-text outline-none transition-colors hover:border-line-strong focus:border-gold focus:ring-[3px] focus:ring-gold-wash"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="listboxId"
    aria-haspopup="listbox"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="truncate">{{ selectedLabel() }}</span>
    <svg
      class="h-[15px] w-[15px] shrink-0 text-text-3 transition-transform"
      [class.rotate-180]="open()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>
  @if (open()) {
    <div
      [id]="listboxId"
      role="listbox"
      [attr.aria-labelledby]="triggerId()"
      class="absolute inset-x-0 top-[calc(100%+7px)] z-30 max-h-[236px] overflow-y-auto rounded-[10px] border border-line-strong bg-surface p-1.5 shadow-card"
    >
      @for (option of options(); track option.value; let index = $index) {
        <button
          #optionButton
          type="button"
          role="option"
          [attr.aria-selected]="index === selectedIndex()"
          class="flex min-h-[42px] w-full items-center justify-between gap-2.5 rounded-[7px] px-2.5 text-left text-sm text-text-2 outline-none hover:bg-surface-2 hover:text-text focus:bg-surface-2 focus:text-text"
          [class.text-gold]="index === selectedIndex()"
          [class.bg-gold-wash]="index === selectedIndex()"
          (click)="selectOption(option)"
          (keydown)="onOptionKeydown($event, index)"
        >
          <span class="truncate">{{ option.label }}</span>
          @if (index === selectedIndex()) {
            <svg
              class="h-[15px] w-[15px] shrink-0"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
          }
        </button>
      }
    </div>
  }
</div>
