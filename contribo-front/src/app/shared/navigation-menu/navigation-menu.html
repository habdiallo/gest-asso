@if (items().length > 0) {
  <nav aria-label="Navigation principale" [class]="navClasses()">
    @for (item of items(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="text-gold-hover"
        ariaCurrentWhenActive="page"
        [class]="linkClasses()"
      >
        {{ item.label }}
      </a>
    }
  </nav>
}
