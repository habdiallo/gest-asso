<div
  class="overflow-x-auto rounded-card border border-line bg-surface"
  [attr.aria-busy]="busy() ? 'true' : 'false'"
>
  <table class="min-w-[760px] w-full border-collapse text-left text-sm">
    <caption class="sr-only">
      {{
        caption()
      }}
    </caption>
    <ng-content />
  </table>
</div>
