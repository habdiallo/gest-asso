<div
  class="max-w-full overflow-x-auto overscroll-x-contain rounded-card border border-line bg-surface"
  [attr.aria-busy]="busy() ? 'true' : 'false'"
>
  <table class="responsive-body min-w-[760px] w-full border-collapse text-left">
    <caption class="sr-only">
      {{
        caption()
      }}
    </caption>
    <ng-content />
  </table>
</div>
