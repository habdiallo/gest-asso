<main class="mx-auto max-w-shell px-4 py-6 pb-9 tablet:px-6 tablet:py-8 tablet:pb-12 lg:px-12 lg:py-10 lg:pb-16">
  <a
    [routerLink]="backRouterLink()"
    class="inline-flex min-h-11 items-center gap-2 rounded px-1 text-sm font-medium normal-case tracking-normal text-gold outline-none transition-colors hover:text-gold-hover focus-visible:ring-[3px] focus-visible:ring-gold-wash tablet:text-[10px] tablet:uppercase tablet:tracking-[0.1em]"
  >
    <svg
      class="h-4 w-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M19 12H5M12 19l-7-7 7-7" />
    </svg>
    <span class="tablet:hidden">{{ mobileBackLabel() || backLabel() }}</span>
    <span class="hidden tablet:inline">{{ backLabel() }}</span>
  </a>

  @if (showHero()) {
    <section
      class="relative mt-6 overflow-visible rounded-none border-0 bg-transparent p-0 shadow-none tablet:mt-8 tablet:overflow-hidden tablet:rounded-card tablet:border tablet:border-line tablet:bg-surface tablet:p-[30px] tablet:shadow-card"
    >
      <div
        class="pointer-events-none absolute -right-40 -top-56 hidden h-[340px] w-[340px] rounded-full border border-[color:color-mix(in_srgb,var(--gold)_22%,transparent)] shadow-[0_0_80px_var(--gold-wash)] tablet:block"
        aria-hidden="true"
      ></div>
      <div class="relative z-10 flex flex-col items-start justify-between gap-5 content:flex-row tablet:gap-6">
        <div class="min-w-0">
          <p class="font-data text-eyebrow font-medium uppercase tracking-eyebrow text-gold">
            {{ kicker() }}
          </p>
          <h1 class="mt-2 font-sans text-[36px] font-medium leading-[1.05] text-text tablet:text-[27px] tablet:leading-tight">
            {{ title() }}
          </h1>
          <p class="mt-2 text-[17px] font-light leading-[1.45] text-text-2 tablet:mt-1 tablet:text-[15px] tablet:leading-normal">
            {{ intro() }}
          </p>
        </div>
        <div
          class="flex w-full flex-wrap gap-2.5 content:w-auto max-[1023px]:[&>app-action-button>a]:w-full max-[1023px]:[&>app-action-button>button]:w-full"
          detail-actions-slot
        >
          <ng-content select="[detail-actions]" />
        </div>
      </div>

      <div class="relative z-10 mt-5 border-0 pt-0 tablet:mt-7 tablet:border-t tablet:border-line tablet:pt-6" detail-metrics-slot>
        <ng-content select="[detail-metrics]" />
      </div>
    </section>
  }

  <ng-content select="[detail-tabs]" />
  <ng-content />
</main>
