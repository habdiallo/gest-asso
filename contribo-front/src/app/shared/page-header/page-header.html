<header
  class="mb-8 flex flex-wrap items-end justify-between gap-6 max-content:flex-col max-content:items-start max-content:gap-4 max-content:mb-6"
>
  <div class="min-w-0">
    @if (kicker(); as kicker) {
      <p class="font-data text-eyebrow font-medium uppercase tracking-eyebrow text-gold">
        {{ kicker }}
      </p>
    }
    <h1
      class="mt-2 font-display text-[clamp(38px,4.2vw,56px)] uppercase leading-[0.94] tracking-[0.035em] text-text"
    >
      {{ title() }}
    </h1>
    @if (intro(); as intro) {
      <p class="mt-4 max-w-[660px] text-[15px] font-light leading-relaxed text-text-2">
        {{ intro }}
      </p>
    }
  </div>
  <div
    class="flex flex-wrap gap-2.5 max-[1023px]:w-full max-[1023px]:[&>app-action-button>a]:w-full max-[1023px]:[&>app-action-button>button]:w-full"
  >
    <ng-content />
  </div>
</header>
