<header
  class="mb-6 flex flex-wrap items-end justify-between gap-5 max-content:flex-col max-content:items-start max-content:gap-4 max-content:mb-6 tablet:mb-8 tablet:gap-6"
>
  <div class="min-w-0">
    @if (kicker(); as kicker) {
      <p class="font-data text-eyebrow font-medium uppercase tracking-eyebrow text-gold">
        {{ kicker }}
      </p>
    }
    <h1
      class="mt-2 font-sans text-[28px] font-medium leading-tight tracking-normal text-text tablet:font-display tablet:text-[clamp(38px,4.2vw,56px)] tablet:uppercase tablet:leading-[0.94] tablet:tracking-[0.035em]"
    >
      {{ title() }}
    </h1>
    @if (intro(); as intro) {
      <p class="mt-3 max-w-[660px] text-[15px] font-light leading-[1.45] text-text-2 tablet:mt-4 tablet:leading-relaxed">
        {{ intro }}
      </p>
    }
  </div>
  <div
    class="flex flex-wrap gap-2.5 max-[1023px]:w-full max-[1023px]:[&>app-action-button>a]:w-full max-[1023px]:[&>app-action-button>button]:w-full"
  >
    <ng-content />
  </div>
</header>
