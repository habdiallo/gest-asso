<header
  class="mb-8 flex flex-wrap items-end justify-between gap-6 max-[660px]:flex-col max-[660px]:items-start max-[660px]:gap-4 max-[660px]:mb-6"
>
  <div class="min-w-0">
    @if (kicker(); as kicker) {
      <p class="font-data text-[10px] font-medium uppercase tracking-[0.15em] text-gold">
        {{ kicker }}
      </p>
    }
    <h1
      class="mt-2 font-display text-[clamp(38px,4.2vw,56px)] uppercase leading-[0.94] tracking-[0.035em] text-text"
    >
      {{ title() }}
    </h1>
    @if (intro(); as intro) {
      <p class="mt-4 max-w-[660px] text-[15px] font-light leading-relaxed text-text-2">
        {{ intro }}
      </p>
    }
  </div>
  <div class="flex flex-wrap gap-2.5">
    <ng-content />
  </div>
</header>
