@if (isAuthenticated()) {
  <!-- Barre latérale desktop/tablette (>= 821px), cf. design/styles.css .sidebar. -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M5 18V6l7 12V6l7 12V6" />
          <path d="M3 3h18M3 21h18" />
        </svg>
      </div>
      <div>
        <div class="sidebar-brand-name">Contribo</div>
        <div class="sidebar-brand-caption">Gestion associative</div>
      </div>
    </div>
    <app-navigation-menu orientation="vertical" class="sidebar-navigation" />
    <div class="sidebar-footer">
      <div class="sidebar-profile">
        @if (sidebarProfile(); as profile) {
          <div class="sidebar-avatar" aria-hidden="true">{{ profile.initials }}</div>
          <div class="sidebar-profile-copy">
            <strong [title]="profile.name">{{ profile.name }}</strong>
            <span>{{ profile.role }}</span>
          </div>
        }
      </div>
      <div class="sidebar-actions">
        <app-theme-toggle class="shrink-0" />
        <app-logout-button class="min-w-0 max-w-full" />
      </div>
    </div>
  </aside>

  <!-- Barre supérieure mobile (< 821px), remplace la barre latérale masquée. -->
  <header
    class="sticky top-0 z-20 flex min-h-14 flex-wrap items-center justify-between gap-2 border-b border-line bg-surface-glass px-4 py-2 min-[821px]:hidden"
  >
    <span class="font-display text-lg uppercase tracking-wide text-gold-hover">Contribo</span>
    <app-theme-toggle class="ml-auto shrink-0" />
    <app-logout-button class="ml-auto min-w-0 max-w-full" />
  </header>

  <!-- Navigation basse mobile (< 821px), équivalent de la barre latérale à cette taille. -->
  <div
    class="fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface-glass min-[821px]:hidden"
  >
    <app-navigation-menu orientation="horizontal" />
  </div>

  <div id="contenu-principal" class="pb-16 min-[821px]:pb-0 min-[821px]:pl-64">
    <router-outlet />
  </div>
} @else {
  <div class="fixed right-4 top-4 z-10">
    <app-theme-toggle />
  </div>
  <router-outlet />
}
