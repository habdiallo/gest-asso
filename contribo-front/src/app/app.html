@if (isAuthenticated()) {
  @let sidebarProfileLabelKey =
    sidebarProfile()?.destinationLabelKey ?? 'shell.sidebar.openMemberSpace';
  <!-- Barre latérale desktop (>= 1181px), cf. design/styles.css .sidebar. -->
  <aside class="desktop-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M5 18V6l7 12V6l7 12V6" />
          <path d="M3 3h18M3 21h18" />
        </svg>
      </div>
      <div>
        <div class="sidebar-brand-name">Contribo</div>
        <div class="sidebar-brand-caption">Gestion associative</div>
      </div>
    </div>
    <app-navigation-menu orientation="vertical" class="sidebar-navigation" />
    <div class="sidebar-footer">
      <button
        type="button"
        class="sidebar-profile"
        [attr.aria-label]="sidebarProfileLabelKey | transloco"
        (click)="openSidebarProfile()"
      >
        @if (sidebarProfile(); as profile) {
          <div class="sidebar-avatar" aria-hidden="true">{{ profile.initials }}</div>
          <div class="sidebar-profile-copy">
            <strong [title]="profile.name">{{ profile.name }}</strong>
            <span>{{ profile.roleLabelKey | transloco }}</span>
          </div>
        }
        <svg
          class="sidebar-profile-chevron"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- Barre supérieure mobile/tablette (< 1181px), remplace la barre latérale masquée. -->
  <header
    class="mobile-header fixed inset-x-0 top-0 z-20 flex min-h-14 flex-wrap items-center justify-between gap-2 border-b border-line bg-surface px-4 py-2 min-[1181px]:hidden"
  >
    <div class="mobile-brand">
      <span class="mobile-brand-mark" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 18V6l7 12V6l7 12V6" />
          <path d="M3 3h18M3 21h18" />
        </svg>
      </span>
      <span class="mobile-brand-name">Contribo</span>
    </div>
    <div class="mobile-header-actions">
      <app-theme-toggle />
      <button
        type="button"
        class="mobile-profile-button"
        [attr.aria-label]="sidebarProfileLabelKey | transloco"
        [attr.aria-expanded]="mobileProfileOpen()"
        aria-controls="mobile-profile-menu"
        (click)="toggleMobileProfile()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21a8 8 0 0 1 16 0" />
        </svg>
      </button>
      @if (mobileProfileOpen()) {
        <div id="mobile-profile-menu" class="mobile-profile-menu" role="menu">
          <button type="button" role="menuitem" (click)="openSidebarProfile()">
            {{ sidebarProfileLabelKey | transloco }}
          </button>
          <app-logout-button />
        </div>
      }
    </div>
  </header>

  <!-- Navigation basse mobile/tablette (< 1181px), équivalent de la barre latérale à cette taille. -->
  <div
    class="mobile-bottom-nav fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface min-[1181px]:hidden"
  >
    <app-navigation-menu orientation="horizontal" />
  </div>

  <div
    id="contenu-principal"
    class="app-content responsive-body pt-16 pb-16 min-[1181px]:pt-0 min-[1181px]:pb-0 min-[1181px]:pl-64"
  >
    <!-- Barre supérieure desktop (>= 1181px), cf. design/styles.css .topbar. -->
    <header class="desktop-topbar hidden min-[1181px]:flex">
      <nav aria-label="Fil d'Ariane" class="desktop-breadcrumb">
        <span>{{ 'shell.breadcrumb.root' | transloco }}</span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="m9 18 6-6-6-6" />
        </svg>
        <strong aria-current="page">{{ breadcrumbLabel() }}</strong>
      </nav>
      <div class="desktop-topbar-actions">
        <app-theme-toggle class="shrink-0" />
      </div>
    </header>
    <router-outlet />
  </div>
} @else {
  <div class="fixed right-4 top-4 z-10">
    <app-theme-toggle />
  </div>
  <router-outlet />
}
