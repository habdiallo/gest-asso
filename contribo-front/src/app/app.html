@if (isAuthenticated()) {
  <!-- Barre latérale desktop/tablette (>= 821px), cf. design/styles.css .sidebar. -->
  <aside
    class="fixed inset-y-0 left-0 z-20 hidden w-64 flex-col border-r border-line bg-surface-glass px-4 py-6 min-[821px]:flex"
  >
    <span class="px-2 font-display text-2xl uppercase tracking-wide text-gold-hover">Contribo</span>
    <app-navigation-menu orientation="vertical" class="mt-8 flex-1 overflow-y-auto" />
    <div class="mt-auto flex items-center gap-2 border-t border-line pt-4">
      <app-theme-toggle />
      <app-logout-button />
    </div>
  </aside>

  <!-- Barre supérieure mobile (< 821px), remplace la barre latérale masquée. -->
  <header
    class="fixed inset-x-0 top-0 z-20 flex h-14 items-center justify-between border-b border-line bg-surface-glass px-4 min-[821px]:hidden"
  >
    <span class="font-display text-lg uppercase tracking-wide text-gold-hover">Contribo</span>
    <div class="flex items-center gap-2">
      <app-theme-toggle />
      <app-logout-button />
    </div>
  </header>

  <!-- Navigation basse mobile (< 821px), équivalent de la barre latérale à cette taille. -->
  <div
    class="fixed inset-x-0 bottom-0 z-20 border-t border-line bg-surface-glass min-[821px]:hidden"
  >
    <app-navigation-menu orientation="horizontal" />
  </div>

  <div
    id="contenu-principal"
    class="pb-16 pt-14 min-[821px]:pb-0 min-[821px]:pl-64 min-[821px]:pt-0"
  >
    <router-outlet />
  </div>
} @else {
  <div class="fixed right-4 top-4 z-10">
    <app-theme-toggle />
  </div>
  <router-outlet />
}
