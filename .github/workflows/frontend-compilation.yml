name: Frontend compilation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compilation:
    name: Frontend compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contribo-front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contribo-front/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run validate:api
      - run: npm run generate:api
      - run: npm run build
      - run: npm run build:mock
