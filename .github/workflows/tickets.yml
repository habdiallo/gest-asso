name: Ticket catalogue

on:
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    name: Ticket catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/tickets.mjs check --base-ref origin/main
      - run: node --test tests/tickets.test.mjs
