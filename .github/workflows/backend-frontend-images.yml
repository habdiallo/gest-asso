name: Backend and frontend images

# PR : tests, build, scan et smoke test, sans publication.
# develop, release/*, hotfix/* : idem puis publication sha-<commit> (+ candidate-* pour release/hotfix).
# main n'est pas reconstruite : la production réutilise les digests promus par promote-release.yml.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - 'release/v*.*.*'
      - 'hotfix/**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contribo-back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test delivery scripts
        working-directory: ${{ github.workspace }}
        run: |
          tests/init-secrets.test.sh
          tests/update-deployment-images.test.sh
          tests/staging-image-digest.test.sh
          tests/open-deployment-pr.test.sh
      - name: Generate ephemeral RSA keys
        run: |
          mkdir -p target/test-rsa
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out target/test-rsa/private.pem
          openssl rsa -pubout -in target/test-rsa/private.pem \
            -out target/test-rsa/public.pem
          echo "RSA_PRIVATE_KEY=file:$PWD/target/test-rsa/private.pem" >> "$GITHUB_ENV"
          echo "RSA_PUBLIC_KEY=file:$PWD/target/test-rsa/public.pem" >> "$GITHUB_ENV"
      - run: mvn -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contribo-front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contribo-front/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:documentation
      - run: npm run check:api
      - run: npm run validate:api
      - run: node ../scripts/check-openapi-generator-version.mjs
      - run: npm run generate:api
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    name: Build, scan, smoke test and publish images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Chaque image est construite UNE seule fois :
    # - PR : chargée localement (contribo-*:ci), rien n'est publié ;
    # - push : poussée avec SBOM et provenance sous un tag de validation non déployable.
    # Ce digest exact est scanné et testé, puis reçoit ses tags sha-*/candidate-* par
    # retag (imagetools create conserve le digest). Le digest publié est donc l'artefact contrôlé.
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
      VALIDATION_TAG: validation-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      backend-digest: ${{ steps.backend-build.outputs.digest }}
      frontend-digest: ${{ steps.frontend-build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute candidate image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag=""
          if [[ "$GITHUB_REF" == refs/heads/release/* || "$GITHUB_REF" == refs/heads/hotfix/* ]]; then
            candidate_tag="candidate-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::12}"
          fi
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"

      - name: Extract backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/contribo-back
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.image-tag.outputs.candidate_tag }},enable=${{ steps.image-tag.outputs.candidate_tag != '' }}

      - name: Extract frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/contribo-front
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.image-tag.outputs.candidate_tag }},enable=${{ steps.image-tag.outputs.candidate_tag != '' }}

      - name: Build backend image once
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/backend.Dockerfile
          load: ${{ env.PUBLISH != 'true' }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}/contribo-back:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, env.VALIDATION_TAG) || 'contribo-back:ci' }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image once
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/frontend.Dockerfile
          load: ${{ env.PUBLISH != 'true' }}
          push: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}/contribo-front:{2}', env.REGISTRY, env.IMAGE_NAMESPACE, env.VALIDATION_TAG) || 'contribo-front:ci' }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Resolve the exact artefacts under validation
        id: refs
        env:
          BACKEND_DIGEST: ${{ steps.backend-build.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            echo "backend=${REGISTRY}/${IMAGE_NAMESPACE}/contribo-back@${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"
            echo "frontend=${REGISTRY}/${IMAGE_NAMESPACE}/contribo-front@${FRONTEND_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "backend=contribo-back:ci" >> "$GITHUB_OUTPUT"
            echo "frontend=contribo-front:ci" >> "$GITHUB_OUTPUT"
          fi

      # Épinglé par SHA de commit (v0.36.0) : les tags de cette action ont déjà été compromis.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.refs.outputs.backend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ steps.refs.outputs.frontend }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Smoke test the containerized stack
        env:
          BACKEND_IMAGE: ${{ steps.refs.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.refs.outputs.frontend }}
        run: |
          set -euo pipefail
          contribo-deploiement/init-secrets.sh --local --dir .local-secrets --generate-db-password
          docker compose -p contribo-ci -f contribo-deploiement/compose.yaml up -d --no-build --wait --wait-timeout 180
          scripts/smoke-test.sh http://127.0.0.1:8081

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p contribo-ci -f contribo-deploiement/compose.yaml logs --no-color --tail 200

      - name: Stop the smoke test stack
        if: always()
        run: docker compose -p contribo-ci -f contribo-deploiement/compose.yaml down --volumes

      - name: Publish the validated digests under their release tags
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          BACKEND_REF: ${{ steps.refs.outputs.backend }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend }}
          BACKEND_TAGS: ${{ steps.backend-meta.outputs.tags }}
          FRONTEND_TAGS: ${{ steps.frontend-meta.outputs.tags }}
        run: |
          set -euo pipefail
          publish() {
            local ref=$1 tags=$2 tag published
            local args=()
            while IFS= read -r tag; do
              [ -n "$tag" ] && args+=(--tag "$tag")
            done <<< "$tags"
            docker buildx imagetools create "${args[@]}" "$ref"
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              published=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
              if [ "$published" != "${ref##*@}" ]; then
                echo "::error::$tag pointe sur $published au lieu de l'artefact validé ${ref##*@}"
                exit 1
              fi
            done <<< "$tags"
          }
          publish "$BACKEND_REF" "$BACKEND_TAGS"
          publish "$FRONTEND_REF" "$FRONTEND_TAGS"

      - name: Publish image digests in the workflow summary
        if: env.PUBLISH == 'true'
        env:
          CANDIDATE_TAG: ${{ steps.image-tag.outputs.candidate_tag }}
          BACKEND_REF: ${{ steps.refs.outputs.backend }}
          FRONTEND_REF: ${{ steps.refs.outputs.frontend }}
        run: |
          set -euo pipefail
          {
            echo '## Published image digests'
            echo
            echo "Backend: ${BACKEND_REF}"
            echo "Frontend: ${FRONTEND_REF}"
            if [ -n "$CANDIDATE_TAG" ]; then
              echo
              echo "Candidate tag: ${CANDIDATE_TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  staging-deployment:
    name: Open staging deployment PR
    needs: images
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the staging pull request in the deployment repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          BACKEND_REF: ghcr.io/${{ github.repository_owner }}/contribo-back@${{ needs.images.outputs.backend-digest }}
          FRONTEND_REF: ghcr.io/${{ github.repository_owner }}/contribo-front@${{ needs.images.outputs.frontend-digest }}
        run: scripts/open-deployment-pr.sh staging "$BACKEND_REF" "$FRONTEND_REF" "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
