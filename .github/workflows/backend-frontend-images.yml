name: Backend and frontend images

# PR : tests, build, scan et smoke test, sans publication.
# develop, release/*, hotfix/* : idem puis publication sha-<commit> (+ candidate-* pour release/hotfix).
# main n'est pas reconstruite : la production réutilise les digests promus par promote-release.yml.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - develop
      - 'release/v*.*.*'
      - 'hotfix/**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contribo-back
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test delivery scripts
        working-directory: ${{ github.workspace }}
        run: |
          tests/init-secrets.test.sh
          tests/update-deployment-images.test.sh
      - name: Generate ephemeral RSA keys
        run: |
          mkdir -p target/test-rsa
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out target/test-rsa/private.pem
          openssl rsa -pubout -in target/test-rsa/private.pem \
            -out target/test-rsa/public.pem
          echo "RSA_PRIVATE_KEY=file:$PWD/target/test-rsa/private.pem" >> "$GITHUB_ENV"
          echo "RSA_PUBLIC_KEY=file:$PWD/target/test-rsa/public.pem" >> "$GITHUB_ENV"
      - run: mvn -B verify

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contribo-front
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contribo-front/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:documentation
      - run: npm run check:api
      - run: npm run validate:api
      - run: node ../scripts/check-openapi-generator-version.mjs
      - run: npm run generate:api
      - run: npm test -- --watch=false
      - run: npm run build

  images:
    name: Build, scan, smoke test and publish images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend-digest: ${{ steps.backend-push.outputs.digest }}
      frontend-digest: ${{ steps.frontend-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/backend.Dockerfile
          load: true
          provenance: false
          tags: contribo-back:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/frontend.Dockerfile
          load: true
          provenance: false
          tags: contribo-front:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Épinglé par SHA de commit (v0.36.0) : les tags de cette action ont déjà été compromis.
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: contribo-back:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: contribo-front:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-setup-trivy: true

      - name: Smoke test the containerized stack
        env:
          BACKEND_IMAGE: contribo-back:ci
          FRONTEND_IMAGE: contribo-front:ci
        run: |
          set -euo pipefail
          contribo-deploiement/init-secrets.sh --local --dir .local-secrets --generate-db-password
          docker compose -p contribo-ci -f contribo-deploiement/compose.yaml up -d --no-build --wait --wait-timeout 180
          scripts/smoke-test.sh http://127.0.0.1:8081

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p contribo-ci -f contribo-deploiement/compose.yaml logs --no-color --tail 200

      - name: Stop the smoke test stack
        if: always()
        run: docker compose -p contribo-ci -f contribo-deploiement/compose.yaml down --volumes

      - name: Compute candidate image tag
        if: github.event_name == 'push'
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag=""
          if [[ "$GITHUB_REF" == refs/heads/release/* || "$GITHUB_REF" == refs/heads/hotfix/* ]]; then
            candidate_tag="candidate-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::12}"
          fi
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract backend image metadata
        if: github.event_name == 'push'
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/contribo-back
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.image-tag.outputs.candidate_tag }},enable=${{ steps.image-tag.outputs.candidate_tag != '' }}

      - name: Publish backend image with SBOM and provenance
        if: github.event_name == 'push'
        id: backend-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/backend.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend

      - name: Extract frontend image metadata
        if: github.event_name == 'push'
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/contribo-front
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.image-tag.outputs.candidate_tag }},enable=${{ steps.image-tag.outputs.candidate_tag != '' }}

      - name: Publish frontend image with SBOM and provenance
        if: github.event_name == 'push'
        id: frontend-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contribo-deploiement/frontend.Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

      - name: Publish image digests in the workflow summary
        if: github.event_name == 'push'
        env:
          CANDIDATE_TAG: ${{ steps.image-tag.outputs.candidate_tag }}
          BACKEND_DIGEST: ${{ steps.backend-push.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-push.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo '## Published image digests'
            echo
            echo "Backend: ghcr.io/${IMAGE_NAMESPACE}/contribo-back@${BACKEND_DIGEST}"
            echo "Frontend: ghcr.io/${IMAGE_NAMESPACE}/contribo-front@${FRONTEND_DIGEST}"
            if [ -n "$CANDIDATE_TAG" ]; then
              echo
              echo "Candidate tag: ${CANDIDATE_TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  staging-deployment:
    name: Open staging deployment PR
    needs: images
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Open or update the staging pull request in the deployment repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          BACKEND_REF: ghcr.io/${{ github.repository_owner }}/contribo-back@${{ needs.images.outputs.backend-digest }}
          FRONTEND_REF: ghcr.io/${{ github.repository_owner }}/contribo-front@${{ needs.images.outputs.frontend-digest }}
        run: scripts/open-deployment-pr.sh staging "$BACKEND_REF" "$FRONTEND_REF" "${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
