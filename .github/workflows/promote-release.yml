name: Promote release

# Un tag vX.Y.Z (minuscule) posé sur la tête de release/vX.Y.Z, fusionnée dans main
# par un merge commit, retague les images déjà testées en staging sans rebuild,
# puis ouvre la PR de production dans le dépôt de déploiement.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  promote:
    name: Retag tested images and open the production PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tagged commit is in main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME doit pointer sur la tête de la release fusionnée dans main (merge commit, pas de squash)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the tested images
        id: retag
        shell: bash
        run: |
          set -euo pipefail
          for image in contribo-back contribo-front; do
            repository="${REGISTRY}/${IMAGE_NAMESPACE}/${image}"
            source="${repository}:sha-${GITHUB_SHA::7}"
            if ! digest=$(docker buildx imagetools inspect "$source" --format '{{json .Manifest.Digest}}' | tr -d '"'); then
              echo "::error::Image testée introuvable : $source. Le commit tagué doit avoir été publié comme candidate."
              exit 1
            fi
            docker buildx imagetools create --tag "${repository}:${GITHUB_REF_NAME}" "${repository}@${digest}"
            echo "${image}=${repository}:${GITHUB_REF_NAME}@${digest}" >> "$GITHUB_OUTPUT"
            echo "${image}: ${repository}:${GITHUB_REF_NAME}@${digest}" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Open or update the production pull request in the deployment repository
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          BACKEND_REF: ${{ steps.retag.outputs.contribo-back }}
          FRONTEND_REF: ${{ steps.retag.outputs.contribo-front }}
        run: scripts/open-deployment-pr.sh production "$BACKEND_REF" "$FRONTEND_REF" "$GITHUB_REF_NAME"
