name: Workflow conventions

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  conventions:
    name: Workflow conventions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier la branche et la cible de la PR
        # Aucune exécution du code de la PR ; entrées non fiables transmises via env.
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          ticket_pattern='^(front|back|fullstack|docs|infra)/(feat|fix|refactor|perf|test|chore)-[1-9][0-9]*-[a-z0-9]+(-[a-z0-9]+)*$'
          release_pattern='^release/v[0-9]+\.[0-9]+\.[0-9]+$'
          hotfix_pattern='^hotfix/[a-z0-9]+(-[a-z0-9]+)*$'
          bootstrap_pattern='^infra/chore-156-activer-flux-release$'
          if [ "$PR_BASE" = main ] && [[ "$PR_BRANCH" =~ $bootstrap_pattern ]]; then
            printf '%s\n' 'PR bootstrap du flux release vers main vérifiée.'
            exit 0
          fi
          if [ "$PR_BASE" = develop ] && { [[ "$PR_BRANCH" =~ $ticket_pattern ]] || [[ "$PR_BRANCH" =~ $release_pattern ]] || [[ "$PR_BRANCH" =~ $hotfix_pattern ]]; }; then
            printf '%s\n' 'PR de ticket ou de réintégration vers develop vérifiée.'
            exit 0
          fi
          if [ "$PR_BASE" = main ] && { [[ "$PR_BRANCH" =~ $release_pattern ]] || [[ "$PR_BRANCH" =~ $hotfix_pattern ]]; }; then
            printf '%s\n' 'PR de release ou hotfix vers main vérifiée.'
            exit 0
          fi
          if [ "$PR_BASE" != develop ] && [ "$PR_BASE" != main ]; then
            printf '%s\n' 'La PR doit cibler develop, ou main pour une release ou un hotfix.' >&2
          elif [ "$PR_BASE" = develop ]; then
            printf '%s\n' 'Une PR vers develop doit provenir d une branche de ticket, release ou hotfix conforme.' >&2
          else
            printf '%s\n' 'Une PR vers main doit provenir de release/vX.Y.Z ou hotfix/<description>.' >&2
          fi
          exit 1
