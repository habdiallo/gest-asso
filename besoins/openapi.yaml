openapi: 3.1.0
info:
  title: Contribo - API de gestion associative
  version: 1.0.0-mvp
  description: |
    Contrat API du MVP Contribo. Les montants sont exprimés en francs guinéens (GNF),
    sous forme d'entiers sans sous-unité. L'API ne déclenche aucun paiement : elle
    enregistre uniquement des encaissements constatés par un utilisateur autorisé.
servers:
  - url: /api/v1
    description: Point d'entrée relatif du MVP
tags:
  - name: Authentification
    description: Ouverture de session sans inscription libre.
  - name: Tableau de bord
    description: Données agrégées nécessaires aux écrans d'accueil.
  - name: Espace personnel
    description: Profil et historique de l'utilisateur connecté.
  - name: Membres
    description: Répertoire et gestion des membres.
  - name: Catégories de revenu
    description: Référentiel des catégories sans montant permanent.
  - name: Utilisateurs et rôles
    description: Comptes, rôles applicatifs et autorisation des opérateurs.
  - name: Campagnes
    description: Campagnes, barèmes, cotisations et clôture.
  - name: Règlements
    description: Encaissements constatés sur les cotisations.
  - name: Cagnottes
    description: Collectes sociales indépendantes des cotisations.
  - name: Contributions
    description: Contributions constatées sur les cagnottes.
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Authentification]
      summary: Se connecter
      description: Authentifie un compte créé par l'association. Aucune inscription libre n'est proposée.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session ouverte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dashboard:
    get:
      tags: [Tableau de bord]
      summary: Consulter le tableau de bord adapté au rôle
      description: |
        Retourne une vue membre pour le rôle MEMBRE et une vue de gestion pour les autres rôles.
        Les agrégats financiers de gestion sont accessibles aux Administrateurs, Trésoriers et
        Opérateurs autorisés. Un Opérateur non autorisé reçoit uniquement les indicateurs non financiers.
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/DashboardCampaignId'
        - $ref: '#/components/parameters/DashboardSocialFundId'
      responses:
        '200':
          description: Tableau de bord du compte connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me:
    get:
      tags: [Espace personnel]
      summary: Consulter mon compte et mon profil membre
      operationId: getCurrentUser
      responses:
        '200':
          description: Compte et membre associés à la session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/dues:
    get:
      tags: [Espace personnel]
      summary: Consulter mes cotisations
      operationId: listMyDues
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/DueStatusFilter'
      responses:
        '200':
          description: Cotisations du membre connecté, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /me/contributions:
    get:
      tags: [Espace personnel]
      summary: Consulter mes contributions aux cagnottes
      operationId: listMyContributions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Contributions du membre connecté, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members:
    get:
      tags: [Membres]
      summary: Lister les membres
      description: Réservé aux Administrateurs, Trésoriers et Opérateurs.
      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/MemberStatusFilter'
      responses:
        '200':
          description: Page de membres triés par nom puis prénom.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Membres]
      summary: Ajouter un membre
      description: |
        Réservé aux Administrateurs et Trésoriers. Le membre est créé ACTIF et son compte
        utilisateur de rôle MEMBRE est créé dans la même transaction. Aucune cotisation n'est créée.
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemberRequest'
      responses:
        '201':
          description: Membre et compte associé créés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}:
    get:
      tags: [Membres]
      summary: Consulter la fiche d'un membre
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs. Un Membre ne peut consulter
        que sa propre fiche via GET /me.
      operationId: getMember
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Fiche du membre et synthèse de sa situation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Membres]
      summary: Modifier les informations complètes d'un membre
      description: |
        Réservé aux Administrateurs et Trésoriers. Le statut n'est pas modifiable par cette
        opération : la désactivation possède une opération dédiée. Une nouvelle catégorie ne
        modifie jamais les cotisations déjà établies.
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Membre modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/contact:
    patch:
      tags: [Membres]
      summary: Modifier les informations non structurantes d'un membre
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs. Cette opération est limitée
        au nom d'usage, au téléphone, au pays et à la ville.
      operationId: updateMemberContact
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberContactRequest'
      responses:
        '200':
          description: Coordonnées modifiées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/dues:
    get:
      tags: [Membres]
      summary: Consulter les cotisations d'un membre
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs pour alimenter la fiche membre.
        Le membre connecté utilise GET /me/dues pour consulter ses propres données.
      operationId: listMemberDues
      parameters:
        - $ref: '#/components/parameters/MemberId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/DueStatusFilter'
      responses:
        '200':
          description: Cotisations du membre, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/deactivation:
    post:
      tags: [Membres]
      summary: Désactiver un membre
      description: |
        Réservé aux Administrateurs. La désactivation ne supprime ni le membre, ni son historique
        financier. Une seconde désactivation est refusée par un conflit métier.
      operationId: deactivateMember
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Membre désactivé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /members/{memberId}/reactivation:
    post:
      tags: [Membres]
      summary: Réactiver un membre
      description: |
        Réservé aux Administrateurs. La réactivation rend le membre de nouveau actif sans modifier
        son historique financier (cotisations, règlements, contributions inchangés). Elle ne
        l'ajoute pas rétroactivement aux campagnes créées pendant sa période d'inactivité ; il ne
        sera concerné qu'à partir des campagnes créées après sa réactivation. Une réactivation
        d'un membre déjà actif est refusée par un conflit métier.
      operationId: reactivateMember
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Membre réactivé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /income-categories:
    get:
      tags: [Catégories de revenu]
      summary: Lister les catégories de revenu
      description: Sert notamment à initialiser les formulaires de membre et de campagne.
      operationId: listIncomeCategories
      responses:
        '200':
          description: Catégories triées par libellé.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IncomeCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Catégories de revenu]
      summary: Créer une catégorie de revenu
      description: Réservé aux Administrateurs. Aucun montant de cotisation n'est associé à la catégorie.
      operationId: createIncomeCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeCategoryRequest'
      responses:
        '201':
          description: Catégorie créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /income-categories/{incomeCategoryId}:
    get:
      tags: [Catégories de revenu]
      summary: Consulter une catégorie de revenu
      operationId: getIncomeCategory
      parameters:
        - $ref: '#/components/parameters/IncomeCategoryId'
      responses:
        '200':
          description: Catégorie demandée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Catégories de revenu]
      summary: Modifier une catégorie de revenu
      description: Réservé aux Administrateurs. La modification ne change aucune cotisation historique.
      operationId: updateIncomeCategory
      parameters:
        - $ref: '#/components/parameters/IncomeCategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeCategoryRequest'
      responses:
        '200':
          description: Catégorie modifiée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomeCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      tags: [Utilisateurs et rôles]
      summary: Lister les comptes utilisateurs
      description: Réservé aux Administrateurs.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/UserRoleFilter'
      responses:
        '200':
          description: Page de comptes utilisateurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    get:
      tags: [Utilisateurs et rôles]
      summary: Consulter la configuration d'un compte
      description: Réservé aux Administrateurs.
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compte demandé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Utilisateurs et rôles]
      summary: Attribuer un rôle et configurer un opérateur
      description: |
        Réservé aux Administrateurs. operatorCanRecordPayments doit être false pour tout rôle
        différent de OPERATOR. Le rôle applicatif ne modifie ni le statut ni la fonction associative.
      operationId: updateUserAccess
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserAccessRequest'
      responses:
        '200':
          description: Accès du compte modifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns:
    get:
      tags: [Campagnes]
      summary: Lister les campagnes de cotisation
      description: Accessible aux Administrateurs, Trésoriers et Opérateurs.
      operationId: listCampaigns
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CampaignStatusFilter'
      responses:
        '200':
          description: Page de campagnes, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Campagnes]
      summary: Créer une campagne et établir ses cotisations
      description: |
        Réservé aux Administrateurs et Trésoriers. La création est atomique : elle photographie
        les membres actifs, leur catégorie et le montant correspondant au barème fourni. Les membres
        inactifs sont exclus. Aucun changement ultérieur de catégorie ne modifie ces cotisations.
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Campagne et cotisations créées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}:
    get:
      tags: [Campagnes]
      summary: Consulter une campagne
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campagne, barème et bilan financier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}/category-amounts:
    put:
      tags: [Campagnes]
      summary: Modifier le barème d'une campagne à venir
      description: |
        Réservé aux Administrateurs et Trésoriers. Pour préserver l'historique, le MVP autorise
        cette modification uniquement avant la date de début et tant qu'aucun règlement n'existe.
        Les cotisations établies sont recalculées atomiquement selon le nouveau barème.
      operationId: updateCampaignCategoryAmounts
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignCategoryAmountsRequest'
      responses:
        '200':
          description: Campagne et cotisations recalculées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}/dues:
    get:
      tags: [Campagnes]
      summary: Consulter les cotisations d'une campagne
      description: Accessible aux Administrateurs, Trésoriers et Opérateurs.
      operationId: listCampaignDues
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/DueStatusFilter'
      responses:
        '200':
          description: Cotisations et montants agrégés de la campagne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /campaigns/{campaignId}/closure:
    post:
      tags: [Campagnes]
      summary: Clôturer une campagne
      description: |
        Réservé aux Administrateurs et Trésoriers. Une campagne clôturée reste consultable,
        mais n'accepte plus de modification ni de nouveau règlement.
      operationId: closeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campagne clôturée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dues/{dueId}:
    get:
      tags: [Campagnes]
      summary: Consulter une cotisation et ses règlements
      description: |
        Accessible aux rôles de gestion autorisés. Un Membre ne peut consulter que sa propre cotisation.
      operationId: getDue
      parameters:
        - $ref: '#/components/parameters/DueId'
      responses:
        '200':
          description: Cotisation détaillée avec historique des règlements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /dues/{dueId}/payments:
    post:
      tags: [Règlements]
      summary: Enregistrer un règlement de cotisation
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs dont l'autorisation globale est active.
        Le montant doit être positif et ne peut pas dépasser le reste à payer. L'utilisateur et l'instant
        de saisie sont déterminés par le serveur.
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/DueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Règlement enregistré et situation recalculée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payments:
    get:
      tags: [Règlements]
      summary: Lister les règlements
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs. L'autorisation globale de
        l'Opérateur est requise pour écrire un règlement, pas pour consulter un historique autorisé.
      operationId: listPayments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/MemberIdQuery'
        - $ref: '#/components/parameters/CampaignIdQuery'
      responses:
        '200':
          description: Règlements du plus récent au plus ancien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /social-funds:
    get:
      tags: [Cagnottes]
      summary: Lister les cagnottes sociales
      description: Accessible aux Administrateurs, Trésoriers et Opérateurs autorisés.
      operationId: listSocialFunds
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/SocialFundStatusFilter'
        - $ref: '#/components/parameters/SocialFundEventTypeFilter'
      responses:
        '200':
          description: Page de cagnottes sociales, de la plus récente à la plus ancienne selon la date de début.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialFundPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Cagnottes]
      summary: Créer une cagnotte sociale
      description: Réservé aux Administrateurs et Trésoriers.
      operationId: createSocialFund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSocialFundRequest'
      responses:
        '201':
          description: Cagnotte créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialFund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /social-funds/{socialFundId}:
    get:
      tags: [Cagnottes]
      summary: Consulter une cagnotte sociale
      operationId: getSocialFund
      parameters:
        - $ref: '#/components/parameters/SocialFundId'
      responses:
        '200':
          description: Cagnotte et bilan de collecte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialFund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /social-funds/{socialFundId}/contributions:
    get:
      tags: [Contributions]
      summary: Lister les contributions d'une cagnotte
      operationId: listSocialFundContributions
      parameters:
        - $ref: '#/components/parameters/SocialFundId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Contributions de la cagnotte, de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Contributions]
      summary: Enregistrer une contribution à une cagnotte
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs dont l'autorisation globale est active.
        La contribution est un encaissement déjà constaté. L'utilisateur et l'instant de saisie sont
        déterminés par le serveur. Une cagnotte clôturée refuse toute contribution.
      operationId: createContribution
      parameters:
        - $ref: '#/components/parameters/SocialFundId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContributionRequest'
      responses:
        '201':
          description: Contribution enregistrée et bilan recalculé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionCreationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /social-funds/{socialFundId}/closure:
    post:
      tags: [Cagnottes]
      summary: Clôturer une cagnotte sociale
      description: Réservé aux Administrateurs et Trésoriers. Les contributions restent consultables.
      operationId: closeSocialFund
      parameters:
        - $ref: '#/components/parameters/SocialFundId'
      responses:
        '200':
          description: Cagnotte clôturée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialFund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contributions:
    get:
      tags: [Contributions]
      summary: Lister les contributions aux cagnottes
      description: |
        Accessible aux Administrateurs, Trésoriers et Opérateurs. L'autorisation globale de
        l'Opérateur est requise pour écrire une contribution, pas pour consulter l'historique
        d'un membre autorisé.
      operationId: listContributions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/MemberIdQuery'
        - $ref: '#/components/parameters/SocialFundIdQuery'
      responses:
        '200':
          description: Contributions du plus récent au plus ancien.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /contributions/{contributionId}:
    get:
      tags: [Contributions]
      summary: Consulter une contribution
      description: |
        Accessible aux rôles de gestion autorisés. Un Membre ne peut consulter que sa propre contribution.
      operationId: getContribution
      parameters:
        - $ref: '#/components/parameters/ContributionId'
      responses:
        '200':
          description: Contribution demandée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès obtenu avec POST /auth/login.

  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page indexé à partir de 0.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    PageSize:
      name: size
      in: query
      description: Nombre maximal d'éléments retournés.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    SearchQuery:
      name: q
      in: query
      description: Recherche textuelle insensible à la casse sur les libellés visibles de la ressource.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: Diallo
    MemberStatusFilter:
      name: status
      in: query
      description: Filtre sur le statut du membre.
      schema:
        $ref: '#/components/schemas/MemberStatus'
    CampaignStatusFilter:
      name: status
      in: query
      description: >-
        Filtre de présentation sur le statut de la campagne. Pour `GET /campaigns`,
        la valeur `OPEN` inclut les campagnes techniques `UPCOMING`, afin que le
        segment utilisateur « Ouvertes » ne masque pas une campagne à venir.
      schema:
        $ref: '#/components/schemas/CampaignStatus'
    SocialFundStatusFilter:
      name: status
      in: query
      description: Filtre sur le statut de la cagnotte.
      schema:
        $ref: '#/components/schemas/SocialFundStatus'
    SocialFundEventTypeFilter:
      name: eventType
      in: query
      description: Filtre sur le type d'événement de la cagnotte.
      schema:
        $ref: '#/components/schemas/SocialEventType'
    DueStatusFilter:
      name: status
      in: query
      description: Filtre sur le statut de cotisation.
      schema:
        $ref: '#/components/schemas/DueStatus'
    UserRoleFilter:
      name: role
      in: query
      description: Filtre sur le rôle applicatif.
      schema:
        $ref: '#/components/schemas/UserRole'
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncomeCategoryId:
      name: incomeCategoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DueId:
      name: dueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SocialFundId:
      name: socialFundId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContributionId:
      name: contributionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberIdQuery:
      name: memberId
      in: query
      description: Limite les opérations à un membre.
      schema:
        type: string
        format: uuid
    CampaignIdQuery:
      name: campaignId
      in: query
      description: Limite les règlements à une campagne.
      schema:
        type: string
        format: uuid
    SocialFundIdQuery:
      name: socialFundId
      in: query
      description: Limite les contributions à une cagnotte.
      schema:
        type: string
        format: uuid
    DashboardCampaignId:
      name: campaignId
      in: query
      description: >-
        Campagne utilisée pour les indicateurs financiers de gestion. Absent :
        agrégat de toutes les campagnes ouvertes (allOpenCampaignsSummary).
      schema:
        type: string
        format: uuid
    DashboardSocialFundId:
      name: socialFundId
      in: query
      description: >-
        Cagnotte utilisée pour les indicateurs financiers de gestion. Absent :
        agrégat de toutes les cagnottes ouvertes (allOpenSocialFundsSummary).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Requête invalide ou validation échouée.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: La requête contient des valeurs invalides.
            fieldErrors:
              - field: endDate
                code: DATE_RANGE_INVALID
                message: La date de fin doit être postérieure ou égale à la date de début.
    Unauthorized:
      description: Authentification absente ou invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Une authentification valide est requise.
    Forbidden:
      description: Le rôle ou l'autorisation du compte ne permet pas cette action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ACCESS_DENIED
            message: Vous n'êtes pas autorisé à effectuer cette action.
    NotFound:
      description: Ressource introuvable ou non visible par le compte connecté.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: La ressource demandée est introuvable.
    Conflict:
      description: L'action viole une règle métier ou l'état courant de la ressource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            overpayment:
              value:
                code: PAYMENT_EXCEEDS_REMAINING_AMOUNT
                message: Le montant dépasse le reste à payer.
            closedResource:
              value:
                code: RESOURCE_CLOSED
                message: La ressource est clôturée et n'accepte plus cette action.
    InternalServerError:
      description: Erreur interne non prévue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Une erreur interne est survenue.

  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 150
          description: Identifiant de connexion communiqué par l'association.
          example: moussa.bah
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
          writeOnly: true
          example: mot-de-passe
    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Jeton à transmettre dans l'en-tête Authorization.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: Durée de validité du jeton en secondes.
          example: 3600
        user:
          $ref: '#/components/schemas/CurrentUser'

    UserRole:
      type: string
      description: Rôle applicatif, indépendant de la fonction associative.
      enum: [ADMINISTRATOR, TREASURER, OPERATOR, MEMBER]
      example: OPERATOR
    MemberStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      example: ACTIVE
    CampaignStatus:
      type: string
      description: UPCOMING avant la date de début, OPEN à partir du début et jusqu'à la clôture explicite, CLOSED après clôture.
      enum: [UPCOMING, OPEN, CLOSED]
      example: OPEN
    DueStatus:
      type: string
      description: |
        DUE si aucun règlement n'existe, PARTIALLY_PAID si le total payé est intermédiaire,
        PAID si le reste vaut zéro, OVERDUE si l'échéance est dépassée avec un reste positif.
      enum: [DUE, PARTIALLY_PAID, PAID, OVERDUE]
      example: PARTIALLY_PAID
    SocialFundStatus:
      type: string
      enum: [OPEN, CLOSED]
      example: OPEN
    PaymentMethod:
      type: string
      enum: [CASH, MOBILE_MONEY, BANK_TRANSFER]
      example: MOBILE_MONEY
    SocialEventType:
      type: string
      enum: [WEDDING, BAPTISM, DEATH, BIRTH, OTHER]
      example: WEDDING
    CurrencyCode:
      type: string
      enum: [GNF]
      example: GNF

    CurrentUser:
      type: object
      additionalProperties: false
      required: [userId, association, member, role, operatorCanRecordPayments, accountActive]
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
        association:
          $ref: '#/components/schemas/AssociationSummary'
        member:
          $ref: '#/components/schemas/MemberSummary'
        role:
          $ref: '#/components/schemas/UserRole'
        operatorCanRecordPayments:
          type: boolean
          description: Attribut significatif uniquement lorsque role vaut OPERATOR; false sinon.
          example: true
        accountActive:
          type: boolean
          readOnly: true
          example: true

    DashboardResponse:
      oneOf:
        - $ref: '#/components/schemas/ManagementDashboard'
        - $ref: '#/components/schemas/MemberDashboard'
      discriminator:
        propertyName: view
        mapping:
          MANAGEMENT: '#/components/schemas/ManagementDashboard'
          MEMBER: '#/components/schemas/MemberDashboard'
    ManagementDashboard:
      type: object
      additionalProperties: false
      required: [view, asOf, viewer, activeMemberCount, registeredMemberCount, newMemberCountThisMonth, openCampaignCount, recentCampaigns]
      properties:
        view:
          type: string
          enum: [MANAGEMENT]
        asOf:
          type: string
          format: date-time
          readOnly: true
        viewer:
          $ref: '#/components/schemas/CurrentUser'
        activeMemberCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 86
        registeredMemberCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 91
        newMemberCountThisMonth:
          type: integer
          minimum: 0
          readOnly: true
          example: 3
        openCampaignCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 2
        recentCampaigns:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/CampaignSummary'
        financialOverview:
          description: Absent pour un Opérateur non autorisé à consulter le bilan financier.
          $ref: '#/components/schemas/ManagementFinancialOverview'
    ManagementFinancialOverview:
      type: object
      additionalProperties: false
      required: [recentPayments]
      properties:
        selectedCampaign:
          description: Présent lorsque campaignId désigne une campagne ouverte précise.
          $ref: '#/components/schemas/CampaignSummary'
        allOpenCampaignsSummary:
          description: Présent lorsque campaignId est omis ; agrégat de toutes les campagnes ouvertes.
          $ref: '#/components/schemas/CampaignsAggregateOverview'
        selectedSocialFund:
          description: Présent lorsque socialFundId désigne une cagnotte ouverte précise.
          $ref: '#/components/schemas/SocialFundSummary'
        allOpenSocialFundsSummary:
          description: Présent lorsque socialFundId est omis ; agrégat de toutes les cagnottes ouvertes.
          $ref: '#/components/schemas/SocialFundsAggregateOverview'
        recentPayments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Payment'
    CampaignsAggregateOverview:
      type: object
      additionalProperties: false
      required: [openCampaignCount, financialSummary]
      properties:
        openCampaignCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 2
        financialSummary:
          $ref: '#/components/schemas/CampaignFinancialSummary'
    SocialFundsAggregateOverview:
      type: object
      additionalProperties: false
      required: [openSocialFundCount, collectedAmount, contributorCount, currency]
      properties:
        openSocialFundCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 2
        targetAmount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: Somme des objectifs définis des cagnottes ouvertes ; absent si aucune n'a d'objectif.
          example: 17000000
        collectedAmount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          example: 12950000
        progressRate:
          type: number
          format: double
          minimum: 0
          readOnly: true
          description: Présent uniquement lorsque targetAmount est défini ; peut dépasser 100.
          example: 76.2
        contributorCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 110
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    MemberDashboard:
      type: object
      additionalProperties: false
      required: [view, asOf, viewer, unpaidDueCount, totalRemainingAmount, paidDueCount, totalContributionAmount, contributedSocialFundCount, currency, recentDues]
      properties:
        view:
          type: string
          enum: [MEMBER]
        asOf:
          type: string
          format: date-time
          readOnly: true
        viewer:
          $ref: '#/components/schemas/CurrentUser'
        unpaidDueCount:
          type: integer
          minimum: 0
          readOnly: true
        totalRemainingAmount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        paidDueCount:
          type: integer
          minimum: 0
          readOnly: true
        totalContributionAmount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        contributedSocialFundCount:
          type: integer
          minimum: 0
          readOnly: true
          example: 3
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        recentDues:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Due'

    PersonSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 201
          readOnly: true
          example: Amadou Diallo
    AssociationSummary:
      type: object
      additionalProperties: false
      required: [id, name, currency]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 150
          readOnly: true
          example: Union Contribo Conakry
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    AuditActor:
      type: object
      additionalProperties: false
      required: [userId, displayName]
      properties:
        userId:
          type: string
          format: uuid
          readOnly: true
        displayName:
          type: string
          minLength: 1
          maxLength: 201
          readOnly: true
          example: Aminata Touré

    IncomeCategorySummary:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          minLength: 1
          maxLength: 100
          example: Catégorie B
    IncomeCategory:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/IncomeCategorySummary'
        - type: object
          required: [memberCount, updatedAt]
          properties:
            memberCount:
              type: integer
              minimum: 0
              readOnly: true
              example: 31
            updatedAt:
              type: string
              format: date-time
              readOnly: true
              example: '2026-09-02T10:15:00Z'
    IncomeCategoryRequest:
      type: object
