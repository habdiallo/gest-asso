spring:
  application:
    name: contribo-back
  config:
    # Chaque fichier du répertoire de secrets devient une propriété (db_password, bootstrap_admin_password).
    import: optional:configtree:${SECRETS_DIR:/run/secrets}/
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contribo}
    username: ${DB_USERNAME:contribo}
    password: ${DB_PASSWORD:${db_password:}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api/v1}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9001}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Contribo backend
    version: 0.1.0-SNAPSHOT

security:
  session-cookie:
    secure: ${SESSION_COOKIE_SECURE:true}
  jwt:
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:1800}
  rsa:
    public-key: ${RSA_PUBLIC_KEY:classpath:certs/public.pem}
    private-key: ${RSA_PRIVATE_KEY:classpath:certs/private.pem}
  proxy:
    trust-headers: ${TRUSTED_PROXY_HEADERS:false}
    trusted-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  rate-limit:
    login:
      ip-limit: ${LOGIN_RATE_LIMIT_IP:10}
      identifier-limit: ${LOGIN_RATE_LIMIT_IDENTIFIER:5}
      window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

bootstrap:
  admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    identifier: ${BOOTSTRAP_ADMIN_IDENTIFIER:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:${bootstrap_admin_password:}}
    password-file: ${BOOTSTRAP_ADMIN_PASSWORD_FILE:}
    association-name: ${BOOTSTRAP_ASSOCIATION_NAME:Contribo}
    currency: ${BOOTSTRAP_ASSOCIATION_CURRENCY:GNF}
    income-category-label: ${BOOTSTRAP_INCOME_CATEGORY_LABEL:Membre}
