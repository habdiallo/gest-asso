spring:
  application:
    name: contribo-back
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contribo}
    username: ${DB_USERNAME:contribo}
    password: ${DB_PASSWORD:contribo}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Contribo backend
    version: 0.1.0-SNAPSHOT

security:
  jwt:
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  rsa:
    public-key: ${RSA_PUBLIC_KEY:classpath:certs/public.pem}
    private-key: ${RSA_PRIVATE_KEY:classpath:certs/private.pem}
