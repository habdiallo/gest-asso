services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contribo}
      POSTGRES_USER: ${POSTGRES_USER:-contribo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - contribo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: contribo-deploiement/backend.Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-contribo}
      DB_USERNAME: ${POSTGRES_USER:-contribo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      RSA_PUBLIC_KEY: file:/run/secrets/rsa_public_key
      RSA_PRIVATE_KEY: file:/run/secrets/rsa_private_key
      TRUSTED_PROXY_HEADERS: ${TRUSTED_PROXY_HEADERS:-false}
      TRUSTED_PROXY_ADDRESSES: ${TRUSTED_PROXY_ADDRESSES:-}
    secrets:
      - rsa_public_key
      - rsa_private_key
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ..
      dockerfile: contribo-deploiement/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      - ./nginx-rate-limits.conf:/etc/nginx/includes/nginx-rate-limits.conf:ro
      - ./nginx-application-locations.conf:/etc/nginx/includes/nginx-application-locations.conf:ro

volumes:
  contribo-db-data:

secrets:
  rsa_public_key:
    file: ${RSA_PUBLIC_KEY_FILE_PATH:?RSA_PUBLIC_KEY_FILE_PATH must be set}
  rsa_private_key:
    file: ${RSA_PRIVATE_KEY_FILE_PATH:?RSA_PRIVATE_KEY_FILE_PATH must be set}
