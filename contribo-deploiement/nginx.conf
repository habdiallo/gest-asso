limit_req_zone $binary_remote_addr zone=contribo_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=contribo_login:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /run/secrets/tls_certificate;
    ssl_certificate_key /run/secrets/tls_private_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location /api/v1/auth/login {
        limit_req zone=contribo_global burst=30 nodelay;
        limit_req zone=contribo_login burst=5 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location /api/v1/ {
        limit_req zone=contribo_global burst=30 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/conf.d/proxy-common.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
