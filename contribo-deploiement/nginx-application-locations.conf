location /api/v1/auth/login {
    limit_req zone=contribo_global burst=30 nodelay;
    limit_req zone=contribo_login burst=5 nodelay;
    proxy_pass $contribo_backend;
    include /etc/nginx/includes/proxy-common.conf;
}

location /api/v1/ {
    limit_req zone=contribo_global burst=30 nodelay;
    proxy_pass $contribo_backend;
    include /etc/nginx/includes/proxy-common.conf;
}

location = /index.html {
    expires -1;
    try_files $uri =404;
}

location = /assets/i18n/fr.json {
    expires -1;
    try_files $uri =404;
}

location ~* \.(?:js|css|woff2|woff|ttf|svg|ico)$ {
    expires 1y;
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
